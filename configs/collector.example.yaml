# bmcgrab collector — local configuration (one file per regional instance).
# Everything else (interval, workers, metric families, inventory source,
# quality thresholds) lives in the central config and is edited from the web
# UI. Any key here can be overridden with BMCGRAB_<SECTION>_<KEY>, e.g.
# BMCGRAB_REGION=eu-west-1.

region: eu-west-1            # inventory filter + tag on every row

database:
  dsn: postgres://bmcgrab_writer@tsdb.central.corp:5432/bmcgrab?sslmode=verify-full
  password_env: BMCGRAB_DB_PASSWORD

cyberark:                    # Central Credential Provider (AIM Web Service)
  url: https://ccp.corp.local/AIMWebService/api/Accounts
  app_id: BMCGrab
  safe: BMC-ReadOnly           # shared account (modes shared/auto) and default Safe for object-only refs
  object: bmc-readonly-svc
  # mode: shared    -> one account for every BMC (secret_ref in the inventory is ignored)
  #       per_asset -> every server must carry its own secret_ref ("safe/object" or "object")
  #       auto      -> secret_ref when present, else the shared account (default)
  mode: auto
  client_cert: /etc/bmcgrab/tls/client.crt
  client_key: /etc/bmcgrab/tls/client.key
  ca_file: /etc/bmcgrab/tls/corp-ca.pem
  cache_ttl: 1h              # secret kept in memory, refreshed on this TTL (±10 % jitter)
  stale_max: 6h              # serve an expired secret this long if the CCP is down (0 = default)
  refresh_ahead: 0.8         # background sync refetches accounts older than 80 % of cache_ttl
  sync_interval: 10m         # background sync period (0 disables); also pre-warms at start
  max_concurrent: 8          # parallel requests to the CCP
  auth_retry: 30m            # a BMC that rejected a password is not retried with the same one before this
  secret_store: protected    # protected = locked + encrypted memory (memguard); plain = fallback

tls:
  ca_file: /etc/bmcgrab/tls/bmc-ca.pem   # CA that signs the BMC certificates

local:
  buffer_dir: /var/lib/bmcgrab/buffer     # NDJSON segments when the DB is down
  config_cache: /var/lib/bmcgrab/config.json
  max_buffer_mb: 2048

metrics:
  listen: ":9090"            # /metrics (Prometheus) and /healthz

# Lab only — used when the cyberark section is removed AND --lab is passed.
# lab_credentials:
#   username_env: BMCGRAB_BMC_USERNAME
#   password_env: BMCGRAB_BMC_PASSWORD
