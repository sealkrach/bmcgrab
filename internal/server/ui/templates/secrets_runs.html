{{if .Flash}}<p class="alert ok">{{.Flash}}</p>{{end}}{{if .Error}}<p class="alert err">{{.Error}}</p>{{end}}
<table class="list wide">
<thead><tr><th>Requested</th><th>By</th><th>Scope</th><th>Region</th><th>Status</th><th>Result</th></tr></thead>
{{range .Data}}<tr><td class="muted">{{.RequestedAt.Format "2006-01-02 15:04:05"}}</td><td>{{.RequestedBy}}</td><td>{{.Scope}}</td><td>{{.Region}}</td><td><code>{{.Status}}</code></td><td class="muted small">{{.Summary}}{{range .Errors}}<br>{{.}}{{end}}</td></tr>{{else}}<tr><td colspan="6" class="muted">No sync yet.</td></tr>{{end}}
</table>
